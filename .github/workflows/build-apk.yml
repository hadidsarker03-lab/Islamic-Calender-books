name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Arrange project
        run: |
          set -e
          M=proj/app/src/main
          J=$M/java/com/hadid/islamiccal
          mkdir -p $J $M/assets/www/icons $M/res/values
          for f in MainActivity Scheduler AlarmReceiver BootReceiver; do cp $f.java $J/; done
          cp AndroidManifest.xml $M/
          cp strings.xml styles.xml $M/res/values/
          cp index.html manifest.json $M/assets/www/
          cp icon-192.png icon-512.png maskable-512.png icon.svg $M/assets/www/icons/
          cat > proj/settings.gradle <<'E'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "IslamicCalendar"
          include ':app'
          E
          cat > proj/build.gradle <<'E'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          E
          cat > proj/gradle.properties <<'E'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          E
          cat > proj/app/build.gradle <<'E'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hadid.islamiccal'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.hadid.islamiccal'
                  minSdk 24
                  targetSdk 35
                  versionCode 5
                  versionName '5.0'
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.13.1'
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          E
          pip install pillow -q
          python3 - <<'E'
          from PIL import Image
          import os
          src = Image.open('icon-512.png')
          for k, v in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p = f'proj/app/src/main/res/mipmap-{k}'
              os.makedirs(p, exist_ok=True)
              im = src.resize((v, v))
              im.save(p + '/ic_launcher.png')
              im.save(p + '/ic_launcher_round.png')
          E
      - name: Install SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: islamic-calendar-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
