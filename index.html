<!DOCTYPE html>
<html lang="bn" data-m="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ইসলামিক ক্যালেন্ডার ও নামাজের সময়</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#022c22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ইসলামিক ক্যালেন্ডার">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--tx:#fff;--sub:#cbd5e1;--gl:rgba(255,255,255,.07);--ln:rgba(255,255,255,.16);--sheet:rgba(2,28,22,.97);--bgd:radial-gradient(circle at top,#064e3b,#022c22 60%,#01130f);--ac:#10b981;--glow:rgba(16,185,129,.2);--gold:#fbbf24;--ok:#22c55e;--c1:#e2e8f0;--c2:#fbbf24;--c3:#6ee7b7;--k1:var(--c1);--k2:var(--c2);--k3:var(--c3);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=indigo]{--bgd:radial-gradient(circle at top,#1e1b4b,#0f172a,#090d16);--ac:#818cf8;--glow:rgba(129,140,248,.2);--c1:#e0e7ff;--c2:#fbbf24;--c3:#34d399;--sheet:rgba(15,23,42,.97)}
[data-theme=cyberpunk]{--bgd:radial-gradient(circle at top,#052e16,#022c22,#040d12);--ac:#2dd4bf;--glow:rgba(45,212,191,.2);--c1:#ccfbf1;--c2:#fb7185;--c3:#fde047}
[data-theme=sunset]{--bgd:radial-gradient(circle at top,#451a03,#290f04,#0f0502);--ac:#f97316;--glow:rgba(249,115,22,.2);--c1:#ffedd5;--c2:#38bdf8;--c3:#a3e635}
[data-theme=royal-neon]{--bgd:radial-gradient(circle at top,#4c1d95,#2e1065,#0f0728);--ac:#f43f5e;--glow:rgba(244,63,94,.2);--c1:#fce7f3;--c2:#67e8f9;--c3:#fcd34d}
[data-m=light]{color-scheme:light;--tx:#0f172a;--sub:#475569;--gl:rgba(255,255,255,.7);--ln:rgba(15,23,42,.13);--sheet:rgba(255,255,255,.98);--bgd:linear-gradient(160deg,#d1fae5,#f8fafc 60%,#fef9c3);--gold:#b45309;--ok:#15803d;--k1:color-mix(in srgb,var(--c1) 15%,#1e293b);--k2:color-mix(in srgb,var(--c2) 55%,#1e293b);--k3:color-mix(in srgb,var(--c3) 55%,#1e293b)}
[data-m=dark]{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html{background:#01130f;height:100dvh;overflow:hidden}
body{background:var(--bgd);color:var(--tx);height:100%;display:flex;justify-content:center;align-items:center;padding:14px;position:relative;overflow:hidden;transition:background .5s,color .4s}
body::before,body::after{content:"";position:fixed;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,var(--ac) 0%,transparent 68%);opacity:.15;z-index:0;pointer-events:none}
body::before{top:-160px;left:-160px}body::after{bottom:-160px;right:-160px}
@keyframes orb{to{transform:translate(70px,50px) scale(1.25)}}
.wrap{position:relative;z-index:1;width:100%;max-width:450px;height:100%;max-height:880px;display:flex;flex-direction:column}
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--gl);border:1px solid var(--ln);border-radius:30px;box-shadow:0 12px 30px rgba(0,0,0,.3),inset 0 1px 2px rgba(255,255,255,.25);overflow:hidden;animation:up .7s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
footer{flex:none;text-align:center;font-size:.75rem;opacity:.6;margin-top:10px;padding-bottom:2px;letter-spacing:.5px}
svg{display:block}
.hd{padding:16px 16px 6px;text-align:center;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><path d='M22 2l5 8 9-3-3 9 8 5-8 5 3 9-9-3-5 8-5-8-9 3 3-9-8-5 8-5-3-9 9 3z' fill='none' stroke='%23fbbf24' stroke-opacity='.13'/></svg>")}
.bis{font-family:'Amiri','Traditional Arabic',serif;font-size:1.25rem;color:var(--gold);margin-bottom:6px;animation:fadeo 1.2s}
.clock{font-size:2.7rem;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;display:flex;justify-content:center;align-items:baseline;gap:8px}
@keyframes pulse{50%{text-shadow:0 0 22px var(--glow)}}
.dt{background:var(--gl);border:1px solid var(--ln);color:var(--tx);padding:6px 16px;border-radius:99px;margin-top:6px;font-size:.9rem;font-weight:700;cursor:pointer;transition:.25s}
.dt:active{transform:scale(.95)}
.cc{display:grid;gap:6px;max-height:0;overflow:hidden;opacity:0;transition:max-height .5s cubic-bezier(.2,.9,.3,1),opacity .4s,margin .4s}
.cc.open{max-height:200px;opacity:1;margin-top:8px}
.cc button{background:var(--gl);border:1px solid;padding:8px 14px;border-radius:14px;display:flex;justify-content:space-between;font-size:.88rem;font-weight:700;cursor:pointer;transform:translateX(-30px);transition:transform .45s cubic-bezier(.2,.9,.3,1),box-shadow .2s}
.cc.open button{transform:none}.cc.open button:nth-child(2){transition-delay:.07s}.cc.open button:nth-child(3){transition-delay:.14s}
.cc button b{opacity:.8;font-size:.78rem}
.in4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 14px}
.mi{background:var(--gl);border:1px solid var(--ln);border-radius:14px;padding:8px 2px;text-align:center;font-size:.68rem;animation:slx .5s both;animation-delay:calc(var(--i)*70ms)}
.mi svg{margin:0 auto 3px;color:var(--gold)}.mi b{display:block;font-size:.8rem;margin-top:2px;font-variant-numeric:tabular-nums}
.live{margin:4px 14px 8px;padding:10px 12px;border-radius:14px;text-align:center;font-weight:700;font-size:.9rem;background:var(--gl);border:1px solid var(--ln);transition:.4s}
.live.on{background:rgba(34,197,94,.16);border-color:var(--ok);color:var(--ok)}
.pr{display:flex;justify-content:space-between;align-items:center;margin:0 14px 6px;padding:9px 14px;border-radius:14px;background:var(--gl);border:1px solid var(--ln);font-size:.92rem;animation:slx .5s both;animation-delay:calc(var(--i)*70ms);transition:.4s}
.pr small{opacity:.85;font-variant-numeric:tabular-nums;font-size:.8rem}
.pr.now{background:rgba(34,197,94,.18);border-color:var(--ok);color:var(--ok);font-weight:700;box-shadow:0 0 8px rgba(34,197,94,.15)}
.cal{padding:10px 14px 14px}
.tab{display:none}.tab.on{display:block;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:slx .45s cubic-bezier(.2,.9,.3,1)}.tab.pad{padding:16px}
@keyframes slx{from{opacity:0;transform:translateX(var(--dx,40px))}}
.sl{animation:slx .4s cubic-bezier(.2,.9,.3,1)}
@keyframes fadeo{from{opacity:0}}
nav{flex:none;display:flex;justify-content:space-around;background:var(--gl);border-top:1px solid var(--ln);padding:8px;gap:4px}
.nb{flex:1;background:none;border:none;color:var(--sub);padding:8px 2px;border-radius:14px;cursor:pointer;font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.3s}
.nb i{display:block;transition:transform .3s}.nb.on{background:var(--ac);color:#fff;box-shadow:0 0 18px var(--glow)}.nb.on i{transform:scale(1.2)}
.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:4px}
.cn strong{text-align:center;cursor:pointer;flex:1}.cn small{display:block;font-family:'Amiri','Traditional Arabic',serif;color:var(--gold);font-size:1rem}
.cn button{background:var(--gl);border:1px solid var(--ln);color:var(--tx);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:.2s}
button:active{transform:scale(.92)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dn{font-size:.72rem;color:var(--ac);font-weight:700;padding-bottom:3px}
.cell{position:relative;background:var(--gl);border:1px solid var(--ln);border-radius:12px;padding:4px 1px;min-height:52px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:transform .15s}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.cell:active{transform:scale(.93)}
.cell .g{font-weight:700;font-size:1rem}
.cell .s{display:flex;gap:5px;font-size:.58rem;font-weight:700;margin-top:1px}.s i{font-style:normal}
.cell.fri{border-color:var(--gold)}
.cell.eid{background:rgba(251,191,36,.2);border-color:var(--gold)}
.cell.ram{border-bottom:3px solid var(--ok)}
.cell.today{background:var(--ac)}.cell.today .g,.cell.today i{color:#fff!important}
.cell.hol::after,.cell.nt::before{content:"";position:absolute;top:3px;width:6px;height:6px;border-radius:50%}
.cell.hol::after{right:4px;background:#ef4444}.cell.nt::before{left:4px;background:var(--gold)}
.btn{background:var(--ac);color:#fff;border:none;padding:12px;border-radius:14px;font-weight:700;cursor:pointer;box-shadow:0 0 14px var(--glow);font-size:1rem;transition:.2s;display:flex;justify-content:center;align-items:center}
.btn.alt{background:var(--gl);color:var(--tx);box-shadow:none;border:1px solid var(--ln)}.btn.w{width:100%;margin-top:10px}
.in{width:100%;background:var(--gl);border:1px solid var(--ln);color:var(--tx);padding:11px;border-radius:12px;outline:none;font-size:1rem;transition:.2s}
.in:focus{border-color:var(--ac);box-shadow:0 0 12px var(--glow)}textarea.in{resize:vertical;min-height:80px}
.form{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.chips{display:flex;gap:4px}
.chip{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--ln);background:var(--gl);color:var(--tx);font-size:.72rem;cursor:pointer;transition:.2s}
.chip.on{background:var(--ac);color:#fff;box-shadow:0 0 10px var(--glow)}
.al{background:var(--gl);border:1px solid var(--ln);padding:11px 13px;border-radius:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;animation:slx .4s both;transition:opacity .3s}
.al.off{opacity:.5}.al strong{color:var(--ac);font-size:1.15rem}.al small{display:block;opacity:.75;font-size:.78rem}.al input{width:20px;height:20px;accent-color:var(--ac)}
.del{background:rgba(239,68,68,.25);border:1px solid rgba(239,68,68,.5);color:#ef4444;padding:6px 10px;border-radius:9px;cursor:pointer}
.empty{text-align:center;opacity:.6;padding:14px}
.glass,.box{position:relative;padding:16px;border-radius:22px;margin-bottom:14px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 28px rgba(0,0,0,.2)}
[data-m=light] .glass,[data-m=light] .box{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,255,255,.6));border-color:#fff;box-shadow:inset 0 1px 0 #fff,0 8px 24px rgba(15,23,42,.08)}
.box h4{font-size:.9rem;color:var(--ac);margin-bottom:9px}
.big{font-size:2rem;font-weight:800;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fit{flex:none}
.sws{display:flex;gap:12px;justify-content:center}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:.25s}
.sw.on{border-color:var(--tx);transform:scale(1.15);box-shadow:0 0 16px var(--glow)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:100;padding:16px}
.modal.bot{align-items:flex-end;padding:0}
.modal.on{display:flex;animation:fadeo .25s}
.mc{background:var(--sheet);border:1px solid var(--ac);padding:22px;border-radius:24px;box-shadow:0 0 30px var(--glow);width:100%;max-width:360px;display:flex;flex-direction:column;gap:9px;color:var(--tx);animation:zoom .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes zoom{from{opacity:0;transform:scale(.7)}}
.bot .mc,.sheet{max-width:450px;border-radius:26px 26px 0 0;animation:sup .45s cubic-bezier(.2,.9,.3,1)}
.sheet{background:var(--sheet);border:1px solid var(--ac);padding:18px 16px 24px;width:100%;max-height:92vh;overflow:auto;color:var(--tx)}
@keyframes sup{from{transform:translateY(100%)}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.nv{display:flex;gap:6px;align-items:center;margin-bottom:10px}.nv strong{flex:1;text-align:center}
.nv button,.sh button{background:var(--gl);border:1px solid var(--ln);color:var(--tx);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.ev{padding:7px 10px;border-radius:10px;background:var(--gl);border:1px solid var(--ln);margin-top:6px;font-size:.88rem;animation:slx .4s both}.ev b{margin-right:6px}
.ramb{background:rgba(34,197,94,.16);border:1px solid var(--ok);color:var(--ok);border-radius:12px;padding:8px;text-align:center;font-weight:700;margin-bottom:8px;display:flex;gap:6px;justify-content:center;animation:slx .4s}
.bdg{display:inline-block;background:var(--gold);color:#1c1917;padding:3px 10px;border-radius:99px;font-size:.8rem;margin:2px 3px 0 0;font-weight:700}
.ap{font-size:1rem;font-weight:700;color:var(--gold);text-shadow:none;letter-spacing:0}
.mq{overflow:hidden;margin:2px -16px 10px;padding:7px 0;background:linear-gradient(90deg,transparent,var(--gl),transparent);border-block:1px solid var(--ln);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mqt{display:flex;width:max-content;animation:mq var(--d,60s) linear infinite;will-change:transform}
.mqt span{padding:0 22px;white-space:nowrap;font-size:.82rem;font-weight:700;display:flex;gap:10px;align-items:center}
.mqt span::before{content:"";width:6px;height:6px;background:var(--gold);transform:rotate(45deg);flex:none}
@keyframes mq{to{transform:translateX(-50%)}}
.sec{display:flex;align-items:center;gap:10px;margin-bottom:4px}.sec h4{font-size:.98rem;color:var(--tx);margin:0}
.sic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),rgba(255,255,255,.08));color:#fff;box-shadow:0 0 14px var(--glow);flex:none}
.lbl{font-size:.78rem;opacity:.75;margin:14px 0 6px;font-weight:600}
.seg{display:flex;background:rgba(0,0,0,.2);border:1px solid var(--ln);border-radius:14px;padding:3px;gap:3px}
[data-m=light] .seg{background:rgba(15,23,42,.06)}
.seg button{flex:1;border:none;background:none;color:var(--sub);padding:9px 4px;border-radius:11px;font-weight:700;font-size:.82rem;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--ac);color:#fff;box-shadow:0 0 12px var(--glow)}
.sw2{position:relative;width:50px;height:28px;flex:none;display:block}
.sw2 input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2;cursor:pointer}
.sw2 i{position:absolute;inset:0;border-radius:99px;background:var(--ln);transition:.25s}
.sw2 i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s}
.sw2 input:checked+i{background:var(--ac);box-shadow:0 0 12px var(--glow)}.sw2 input:checked+i::after{transform:translateX(22px)}
.up{display:flex;flex-direction:column;align-items:flex-start;width:100%;margin-top:6px;padding:9px 12px;border-radius:12px;background:var(--gl);border:1px solid var(--ln);color:var(--tx);cursor:pointer;text-align:left}.up small{opacity:.7;font-size:.74rem}
.hid *{animation-play-state:paused!important}
.cr{margin:80px 0 10px;opacity:.9}
.crl{font-size:.68rem;letter-spacing:1.6px;text-transform:uppercase;opacity:.6}
.crn{font-size:1.15rem;font-weight:800;margin:3px 0 10px;color:var(--gold)}
.crv{font-size:.78rem;opacity:.7}.crv b{color:var(--tx)}
html.wg nav,html.wg .cal,html.wg .mq,html.wg .bis,html.wg .cc,html.wg #tab-home>button{display:none!important}
html.wg .tab:not(#tab-home){display:none!important}
html.wg body{padding:6px}html.wg .clock{font-size:2.2rem}
.web-only{}html.nat .web-only{display:none!important}
.bxc{display:flex;flex-direction:column;align-items:flex-start;width:100%;margin-top:8px;padding:12px 14px;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--ln);color:var(--tx);cursor:pointer;text-align:left}.bxc small{opacity:.7;margin-top:2px}
.bxs{display:flex;align-items:center;gap:10px;width:100%;margin-top:6px;padding:10px 12px;border-radius:14px;background:var(--gl);border:1px solid var(--ln);color:var(--tx);cursor:pointer;text-align:left}.bxs .no{min-width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--ac);color:#fff;font-size:.8rem;flex:none}.bxs b{flex:1}.bxs small{opacity:.7}
.bxbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.bxbar>b{flex:1;font-size:1rem}.bxbar button{background:var(--gl);border:1px solid var(--ln);color:var(--tx);min-width:34px;height:34px;border-radius:12px;cursor:pointer;padding:0 8px;font-weight:700;display:grid;place-items:center}.bxbar .fs{display:flex;gap:4px}
.ay{padding:12px;margin-top:8px;border-radius:14px;background:var(--gl);border:1px solid var(--ln);font-size:calc(var(--fs,1)*1rem)}
.ay .an{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:99px;background:var(--ac);color:#fff;font-size:.72rem;margin-bottom:6px}
.ar{font-family:'Amiri','Traditional Arabic','Noto Naskh Arabic',serif;font-size:1.7em;line-height:2.1;direction:rtl;text-align:right;margin-bottom:6px}
.tr{font-size:.95em;line-height:1.75;white-space:pre-wrap}
.bxpg{display:flex;gap:8px;align-items:center;margin-top:12px}.bxpg>*{flex:1}.bxpg .in{flex:none}
.rr{display:grid;grid-template-columns:28px 1.4fr 1fr 1fr;gap:6px;padding:7px 8px;border-radius:10px;background:var(--gl);border:1px solid var(--ln);margin-top:5px;font-size:.74rem;align-items:center;font-variant-numeric:tabular-nums}
.rr.h{background:none;border:none;color:var(--ac);font-weight:700}
.rr.td{background:rgba(34,197,94,.18);border-color:var(--ok);color:var(--ok);font-weight:700}
.note{font-size:.76rem;opacity:.7;margin-top:10px;text-align:center}
.cr{text-align:center;font-size:.75rem;opacity:.6;margin:24px 0 8px;letter-spacing:.5px}
.gap{gap:8px}.btn.ic{gap:8px}
#ptr{transition:fill .2s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="app">
  <section id="tab-home" class="tab on">
    <div class="hd">
      <div class="bis">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
      <div class="mq"><div class="mqt" id="mqt"></div></div>
      <div class="clock"><small class="ap" id="cAp"></small><span id="clock"></span></div>
      <button class="dt" id="mainDate" onclick="$('cc').classList.toggle('open')"></button>
      <div class="cc" id="cc"></div>
    </div>
    <div class="in4" id="info"></div>
    <div class="live" id="live"></div>
    <div id="pr"></div>
    <button class="btn alt ic" style="margin:0 14px 4px;width:calc(100% - 28px)" onclick="openRam()"><i data-ic="moon"></i><span data-i="ramCal"></span></button>
    <div class="cal">
      <div class="cn"><button onclick="mNav(-1,0)"><i data-ic="l"></i></button><strong id="mT" onclick="MV=newView(S.main);drawMain(0)"></strong><button onclick="mNav(1,0)"><i data-ic="r"></i></button></div>
      <div class="grid" id="mGrid"></div>
    </div>
  </section>
  <section id="tab-alarm" class="tab pad">
    <div class="form">
      <input type="time" id="aT" class="in"><input type="text" id="aL" class="in" maxlength="40" data-p="phLabel">
      <div class="chips" id="chips"></div>
      <button class="btn" onclick="addAlarm()" data-i="btnAdd"></button>
    </div>
    <div id="aList"></div>
  </section>
  <section id="tab-books" class="tab pad"><div id="bxMain"></div></section>
  <section id="tab-tools" class="tab pad">
    <div class="box"><h4 data-i="sw"></h4><div class="big" id="swD">00:00.0</div>

function bnLens(y){const gy=y+594,lp=(gy%4===0&&gy%100!==0)||gy%400===0;return[31,31,31,31,31,30,30,30,30,30,lp?31:30,30]}
function bnParts(d){
  const date=new Date(d.getFullYear(),d.getMonth(),d.getDate());let y=date.getFullYear(),st=new Date(y,3,14);
  if(date<st){y--;st=new Date(y,3,14)}
  const Ls=bnLens(y-593);let diff=Math.round((date-st)/864e5),i=0;
  while(i<11&&diff>=Ls[i]){diff-=Ls[i];i++}
  return{d:diff+1,m:i,y:y-593};
}
let HF;try{HF=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'})}catch(e){}

}

function evOf(c){

/* নামাজের সময় (কারাচি পদ্ধতি, হানাফি আসর) — ডিভাইসেই হিসাব */
const D=Math.PI/180,sin=a=>Math.sin(a*D),cos=a=>Math.cos(a*D),tan=a=>Math.tan(a*D),asin=x=>Math.asin(x)/D,acos=x=>Math.acos(x)/D,atan2=(y,x)=>Math.atan2(y,x)/D,fx=(a,n)=>a-n*Math.floor(a/n);
function jd(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunTimes(date){
  const[lat,lon]=coords(),tz=-date.getTimezoneOffset()/60,J=jd(date.getFullYear(),date.getMonth()+1,date.getDate())-lon/360;
  const sp=q0=>{const Dd=J+q0-2451545,g=fx(357.529+.98560028*Dd,360),q=fx(280.459+.98564736*Dd,360),Lg=fx(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-3.6e-7*Dd,RA=fx(atan2(cos(e)*sin(Lg),cos(Lg))/15,24);return{dc:asin(sin(e)*sin(Lg)),eq:q/15-RA}};
  const mid=q=>fx(12-sp(q).eq,24),ang=(a,q,ccw)=>{const dc=sp(q).dc,v=acos((-sin(a)-sin(dc)*sin(lat))/(cos(dc)*cos(lat)))/15;return mid(q)+(ccw?-v:v)};
  const asr=q=>ang(-atan2(1,2+tan(Math.abs(lat-sp(q).dc))),q,0),base=new Date(date.getFullYear(),date.getMonth(),date.getDate()).getTime();
  const A=h=>new Date(Math.round((base+(h+tz-lon/15)*3600e3)/6e4)*6e4);
  const r={sunrise:A(ang(.833,6/24,1)),sunset:A(ang(.833,18/24,0))},ak=date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate()),w=SUN[locKey()+'|'+ak];
  if(w){r.sunrise=new Date(w[0]);r.sunset=new Date(w[1])}
  const fj=A(ang(18,5/24,1)),mm=x=>new Date(x.getTime()+18e4);
  return{sehri:new Date(fj.getTime()-18e4),fajr:mm(fj),sunrise:r.sunrise,dhuhr:A(mid(.5)+1/60),asr:A(asr(13/24)),sunset:r.sunset,iftar:mm(r.sunset),maghrib:mm(r.sunset),isha:A(ang(18,18/24,0))};
}
function getSched(n){

    const Y=sunTimes(new Date(n.getFullYear(),n.getMonth(),n.getDate()-1)),Z=sunTimes(n),M=sunTimes(new Date(n.getFullYear(),n.getMonth(),n.getDate()+1));
    SC={key,Z,list:[['isha0',Y.isha,Z.fajr],['fajr',Z.fajr,Z.sunrise],['dhuhr',Z.dhuhr,Z.asr],['asr',Z.asr,Z.sunset],['maghrib',Z.maghrib,Z.isha],['isha',Z.isha,M.fajr]]};

const fmtT=d=>{const h=d.getHours();return wrapT(h,`${dg(h%12||12)}:${dg(pad(d.getMinutes()))}`)};
const hms=ms=>{const s=Math.max(0,Math.floor(ms/1000));return`${dg(pad(Math.floor(s/3600)))}:${dg(pad(Math.floor(s%3600/60)))}:${dg(pad(s%60))}`};

/* সূর্যোদয়/সূর্যাস্ত — Open-Meteo ওয়েদার API (অফলাইনে ডিভাইসের হিসাব) */

    d.time.forEach((k,i)=>{SUN[kk+'|'+k]=[Date.parse(d.sunrise[i]+':00'+os),Date.parse(d.sunset[i]+':00'+os)]});

  const nm=S.lang==='bn'?QN[n-1]:'Surah '+n;BK={v:'q',n};S.rd={t:'q',n,title:nm};save();
  bxSet(bxBar(nm,'bxQList()')+`<div class="note">${t('bkLoad')}</div>`);
  try{const j=await bget([qUrl(n)]),ar=j.data[0].ayahs,bn=j.data[1].ayahs;if(BK.v!=='q'||BK.n!==n)return;const m=S.qm||'both';
    bxSet(bxBar(nm+' · '+dg(QC[n-1])+' '+t('bkAyah'),'bxQList()')+bxModeBar()+ar.map((a,i)=>`<div class="ay"><span class="an">${dg(a.numberInSurah)}</span>${m!=='bn'?`<div class="ar">${esc(a.text)}</div>`:''}${m!=='ar'?`<div class="tr">${esc(bn[i]?bn[i].text:'')}</div>`:''}</div>`).join('')+bxPager(n>1?`bxQ(${n-1})`:'',n<114?`bxQ(${n+1})`:''));}
  catch(e){if(BK.v==='q'&&BK.n===n)bxSet(bxBar(nm,'bxQList()')+`<div class="note">${t('bkErr')}</div>`)}
}
async function bxHad(ed,sec){
  BK={v:'h',ed,sec};if(!HED)try{await loadHED()}catch(e){}
  const nm=(HED&&HED.find(x=>x.name===ed)||{}).book||ed,ttl=nm+' · '+t('bkSec')+' '+dg(sec);S.hs=S.hs||{};S.hs[ed]=sec;S.rd={t:'h',ed,sec,title:ttl};save();
  bxSet(bxBar(ttl,'bxHome()')+`<div class="note">${t('bkLoad')}</div>`);
  const u=e=>[`${ED}editions/${e}/sections/${sec}.min.json`,`${ED}editions/${e}/sections/${sec}.json`],arE='ara-'+ed.slice(4),hasAr=HED&&HED.some(x=>x.name===arE);
  try{const[b,a]=await Promise.all([bget(u(ed)),hasAr?bget(u(arE)).catch(()=>null):null]);if(BK.v!=='h'||BK.ed!==ed||BK.sec!==sec)return;
    const am={};if(a&&a.hadiths)a.hadiths.forEach(x=>am[x.hadithnumber]=x.text);const m=S.qm||'both',sn=b.metadata&&b.metadata.section&&b.metadata.section[sec]||'',hs=b.hadiths||[];
    const mid=`<input id="bxSN" type="number" class="in" min="0" value="${sec}" style="max-width:90px"><button class="btn" onclick="bxHad('${ed}',Math.max(0,+$('bxSN').value||0))">${t('bkGo')}</button>`;
    bxSet(bxBar(ttl,'bxHome()')+bxModeBar()+(sn?`<div class="lbl">${esc(sn)}</div>`:'')+(hs.length?hs.map(x=>`<div class="ay"><span class="an">${dg(x.hadithnumber)}</span>${m!=='bn'&&am[x.hadithnumber]?`<div class="ar">${esc(am[x.hadithnumber])}</div>`:''}${m!=='ar'||!am[x.hadithnumber]?`<div class="tr">${esc(x.text)}</div>`:''}${(x.grades||[]).length?`<small style="opacity:.7">${esc(x.grades.map(g=>g.grade).filter(Boolean).join(', '))}</small>`:''}</div>`).join(''):`<div class="note">${t('bkNone')}</div>`)+bxPager(sec>0?`bxHad('${ed}',${sec-1})`:'',hs.length?`bxHad('${ed}',${sec+1})`:'',mid));}
  catch(e){if(BK.v==='h'&&BK.ed===ed&&BK.sec===sec)bxSet(bxBar(ttl,'bxHome()')+`<div class="note" style="text-align:left">${t('bkErr')}</div>`+bxPager(sec>0?`bxHad('${ed}',${sec-1})`:'',`bxHad('${ed}',${sec+1})`))}
}
function bxImport(i){
  const f=i.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const a=ld('ub',[]);a.push({id:Date.now(),title:f.name.replace(/\.[^.]+$/,''),text:String(r.result)});if(!sv('ub',a))alert(t('bkFull'));bxHome()};r.readAsText(f,'utf-8');
}
function bxUb(id,p){
  const b=ld('ub',[]).find(x=>x.id===id);if(!b)return bxHome();BK={v:'u',id,p};
  const pg=[];let r=b.text;while(r.length){let k=Math.min(6000,r.length);if(r.length>6000){const q=r.lastIndexOf('\n',6000);if(q>2000)k=q}pg.push(r.slice(0,k));r=r.slice(k)}
  p=Math.max(0,Math.min(pg.length-1,p));
  bxSet(bxBar(b.title,'bxHome()')+`<div class="ay"><div class="tr">${esc(pg[p]||'')}</div></div>`+bxPager(p>0?`bxUb(${id},${p-1})`:'',p<pg.length-1?`bxUb(${id},${p+1})`:'',`<span class="note">${dg(p+1)} / ${dg(pg.length||1)}</span>`)+`<button class="del" style="margin-top:12px;width:100%" onclick="bxUbDel(${id})">${t('bkDel')}</button>`);
}
function bxUbDel(id){sv('ub',ld('ub',[]).filter(x=>x.id!==id));bxHome()}

let qT2=0;
function qPush(){if(!NATIVE)return;clearTimeout(qT2);qT2=setTimeout(pushNative,800)}
function pushNative(){
  const n=today0(),out=[],now=Date.now(),seen=new Set();
  for(let d=0;d<14;d++){const c=addD(n,d),z=sunTimes(c),ds=c.getFullYear()+pad(c.getMonth()+1)+pad(c.getDate());
    if(S.adhan)[['fajr',z.fajr],['dhuhr',z.dhuhr],['asr',z.asr],['maghrib',z.maghrib],['isha',z.isha]].forEach(([k,x])=>{if(+x>now)out.push({t:+x,id:'p'+ds+k,n:t('pn')[k],b:t('adhanBody'),k:'adhan'})});
    S.alarms.forEach(a=>{if(!a.active)return;const dd=a.days||[];if(dd.length&&!dd.includes(c.getDay()))return;const[h,m]=a.time.split(':').map(Number),x=new Date(c.getFullYear(),c.getMonth(),c.getDate(),h,m).getTime();if(x<=now)return;if(!dd.length){if(seen.has(a.id))return;seen.add(a.id)}out.push({t:x,id:'a'+a.id+'_'+ds,n:a.label,b:t('alarmBody'),k:'alarm',aid:dd.length?0:a.id})});
  }
  try{AndroidApp.setSchedule(JSON.stringify(out))}catch(e){}
}
function applyFired(){if(!NATIVE)return;try{const ids=JSON.parse(AndroidApp.consumeFired()||'[]');if(ids.length){S.alarms.forEach(a=>{if(ids.includes(a.id))a.active=false});sv('cal_v4',S);renderAlarms()}}catch(e){}}
window.onNativeResume=()=>{applyFired();if(!S.gps&&!S.up)getLoc(true);qPush()};
window.onNativeBack=()=>{const m=document.querySelector('.modal.on');if(m){m.classList.remove('on');return true}if(curTab==='books'&&BK.v!=='home'){bxBack();return true}if(curTab!=='home'){tab('home');return true}return false};

function applyLook(){

function segs(){document.querySelectorAll('.seg').forEach(e=>{const k=e.dataset.k,o=e.dataset.o.split(','),l=e.dataset.l.split(',');e.innerHTML=o.map((v,i)=>`<button class="${String(S[k])===v?'on':''}" onclick="upd('${k}',${isNaN(v)?"'"+v+"'":v})">${l[i][0]==='~'?t(l[i].slice(1)):l[i]}</button>`).join('')})}
function upd(k,v){S[k]=v;if(k==='lang'){save();location.reload();return}if(k==='city'){S.gps=false;S.up=null}save();if(k==='city'){SC={key:''};fetchSun()}if(k==='main')MV=newView(v);if(['lang','hadj','main','city'].includes(k)){if(k==='hadj')MV=newView(S.main);applyLang()}else applyLook();segs()}
function applyLang(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));

  ['tone','city'].forEach(k=>$(k).value=S[k]);segs();mqKey='';$('adhanOn').checked=S.adhan;$('notifOn').checked=!!S.notif;
  $('snzB').textContent=`${t('snz')} ${dg(S.snz)}`;$('swB').textContent=t(swRun?'pause':'start');$('tmB').textContent=t(tmEnd?'pause':'start');

  lastR='';tick(true);drawMain(0);renderAlarms();convert();locStat();

function tick(force){
  const n=new Date();if(!force&&n.getSeconds()===lastSec)return;lastSec=n.getSeconds();
  const H=n.getHours(),tm=`${dg(pad(H%12||12))}:${dg(pad(n.getMinutes()))}:${dg(pad(n.getSeconds()))}`;if(S.lang==='en'){$('cAp').textContent='';$('clock').textContent=tm+' '+tod(H)}else{$('cAp').textContent=tod(H);$('clock').textContent=tm}
  const d=today0(),md=$('mainDate');md.textContent=strOf(S.main,d);md.style.color=`var(--k${K[S.main]})`;
  TY.forEach(ty=>{const e=$('c_'+ty);if(e)e.textContent=strOf(ty,d)});
  const ds=d.toDateString()+S.lang+S.hadj;if(ds!==mqKey){mqKey=ds;drawMq()}
  prayUpdate(n);checkAlarms(n);
}

/* অ্যালার্ম */
function unlock(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function chip(i){sel.has(i)?sel.delete(i):sel.add(i);document.querySelectorAll('.chip').forEach((e,j)=>e.classList.toggle('on',sel.has(j)))}
function fmt12(tm){const[h,m]=tm.split(':').map(Number);return wrapT(h,`${dg(pad(h%12||12))}:${dg(pad(m))}`)}
function addAlarm(){
  unlock();const tm=$('aT').value;if(!tm)return;
  S.alarms.push({id:Date.now(),time:tm,label:$('aL').value.trim()||t('def'),active:true,days:[...sel],last:''});
  $('aT').value='';$('aL').value='';sel.clear();document.querySelectorAll('.chip').forEach(e=>e.classList.remove('on'));save();renderAlarms();
}
const repTxt=a=>{const d=a.days||[];return!d.length?t('once'):d.length===7?t('daily'):d.map(i=>t('days')[i]).join(', ')};
function renderAlarms(){
  const l=$('aList');if(!S.alarms.length){l.innerHTML=`<div class="empty">${t('none')}</div>`;return}
  l.innerHTML=[...S.alarms].sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<div class="al${a.active?'':' off'}"><input type="checkbox" ${a.active?'checked':''} onchange="togAlarm(${a.id})"><div style="flex:1"><strong>${fmt12(a.time)}</strong><small>${esc(a.label)} · ${repTxt(a)}</small></div><button class="del" onclick="delAlarm(${a.id})">${t('del')}</button></div>`).join('');
}
function togAlarm(id){const a=S.alarms.find(x=>x.id===id);if(a){a.active=!a.active;save();renderAlarms()}}
function delAlarm(id){S.alarms=S.alarms.filter(a=>a.id!==id);save();renderAlarms()}
function checkAlarms(n){if(NATIVE)return;
  if(ringing!==null)return;
  const hm=pad(n.getHours())+':'+pad(n.getMinutes()),st=n.toDateString()+hm;
  for(const a of S.alarms){const d=a.days||[];
    if(a.active&&a.time===hm&&a.last!==st&&(!d.length||d.includes(n.getDay()))){a.last=st;if(!d.length)a.active=false;save();renderAlarms();ring(a.label);return}}
  if(snoozeAt&&Date.now()>=snoozeAt){snoozeAt=0;ring(snoozeLabel)}
}
function beep(v,f,dur){
  if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),c=[['triangle',880],['sine',660],['square',520]][S.tone];
  o.type=f?'sine':c[0];o.frequency.value=f||c[1];g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+(dur||.3));
}
function ring(label,ad){
  notify(label,t(ad?'adhan':'ringing'));
  ringing=label;$('mLabel').textContent=label;$('ringT').textContent=t(ad?'adhan':'ringing');$('snzB').style.display=ad?'none':'';$('ringM').classList.add('on');
  unlock();clearInterval(ringTimer);vol=.05;
  if(ad){const src=ld('adhan_a','');if(src){adA=new Audio(src);adA.play().catch(()=>{});return}
    const N=[392,440,494,523,494,440];let i=0;const go=()=>beep(.35,N[i++%6],.55);go();ringTimer=setInterval(go,700);return}
  const go=()=>{vol=Math.min(.7,vol+.04);beep(vol)};go();ringTimer=setInterval(go,600);
  if(navigator.vibrate)navigator.vibrate([300,150,300]);
}
function stopAlarm(){clearInterval(ringTimer);if(adA){adA.pause();adA=null}ringing=null;$('ringM').classList.remove('on')}
function snooze(){snoozeLabel=ringing;stopAlarm();snoozeAt=Date.now()+S.snz*60000}
function loadAdhan(i){
  const f=i.files[0];if(!f)return;if(f.size>3e6){$('adS').textContent=t('adBig');return}
  const r=new FileReader();r.onload=()=>{sv('adhan_a',r.result);$('adS').textContent=t('adSaved')};r.readAsDataURL(f);
}

/* স্টপওয়াচ ও টাইমার */
let swRun=false,swStart=0,swEl=0,tmEnd=0,tmLeft=0;
function swToggle(){swRun?(swEl+=performance.now()-swStart,swRun=false):(swStart=performance.now(),swRun=true);$('swB').textContent=t(swRun?'pause':'start');if(swRun)(function f(){swDraw();if(swRun)requestAnimationFrame(f)})()}
function swReset(){swRun=false;swEl=0;$('swB').textContent=t('start');swDraw()}
function swDraw(){const ms=swEl+(swRun?performance.now()-swStart:0),s=ms/1000;$('swD').textContent=`${dg(pad(Math.floor(s/60)))}:${dg(pad(Math.floor(s%60)))}.${dg(Math.floor(ms%1000/100))}`}
function tmToggle(){unlock();if(tmEnd){tmLeft=tmEnd-Date.now();tmEnd=0}else{if(!tmLeft)tmLeft=Math.max(1,+$('tmIn').value||1)*60000;tmEnd=Date.now()+tmLeft}$('tmB').textContent=t(tmEnd?'pause':'start');tmDraw()}
function tmDraw(){
  if(tmEnd&&Date.now()>=tmEnd){tmEnd=0;tmLeft=0;$('tmB').textContent=t('start');ring(t('tm'))}
  const s=Math.ceil((tmEnd?Math.max(0,tmEnd-Date.now()):tmLeft)/1000);$('tmD').textContent=`${dg(pad(Math.floor(s/60)))}:${dg(pad(s%60))}`;
}
