<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html{background:#01130f;height:100dvh;overflow:hidden}
body{background:var(--bgd);color:var(--tx);height:100%;display:flex;justify-content:center;align-items:center;padding:14px;position:relative;overflow:hidden;transition:background .5s,color .4s}

.locbar{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 14px 8px;padding:8px 12px;border-radius:14px;background:var(--gl);border:1px solid var(--ln);color:var(--tx);font-size:.82rem;font-weight:700;cursor:pointer;text-align:center}

.dtop{display:flex;align-items:center;gap:6px}.dtop h4{flex:1}.dib{background:none;border:none;color:var(--tx);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}.dib.on{background:var(--ac);color:#fff}
.dg{font-weight:800;font-size:1.05rem;margin:18px 4px 2px}

.dcp{padding:2px 0 10px}.dhd{display:flex;align-items:center;justify-content:space-between;gap:8px}.bm{background:none;border:none;color:var(--sub);cursor:pointer;display:grid;padding:4px}.bm.on{color:var(--gold)}.bm.on svg{fill:var(--gold)}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.cpr .cpl{text-align:center;font-weight:800;margin:10px 0 2px}

.cpr .crv{text-align:center;margin-top:14px}
.cal{padding:10px 14px 14px}
.tab{display:none}.tab.on{display:block;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:slx .45s cubic-bezier(.2,.9,.3,1)}.tab.pad{padding:16px}
@keyframes slx{from{opacity:0;transform:translateX(var(--dx,40px))}}
.sl{animation:slx .4s cubic-bezier(.2,.9,.3,1)}
@keyframes fadeo{from{opacity:0}}

.nb{flex:1;background:none;border:none;color:var(--sub);padding:8px 2px;border-radius:14px;cursor:pointer;font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.3s}
.nb span{white-space:nowrap;font-size:.66rem;letter-spacing:-.1px}.nb i{display:block;transition:transform .3s}.nb.on{background:var(--ac);color:#fff;box-shadow:0 0 18px var(--glow)}.nb.on i{transform:scale(1.2)}
.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:4px}
.cn strong{text-align:center;cursor:pointer;flex:1}.cn small{display:block;font-family:'Amiri','Traditional Arabic',serif;color:var(--gold);font-size:1rem}

button:active{transform:scale(.92)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dn{font-size:.72rem;color:var(--ac);font-weight:700;padding-bottom:3px}
.cell{position:relative;background:var(--gl);border:1px solid var(--ln);border-radius:12px;padding:4px 1px;min-height:52px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:transform .15s}

.cell:active{transform:scale(.93)}
.cell .g{font-weight:700;font-size:1rem}
.cell .s{display:flex;gap:5px;font-size:.58rem;font-weight:700;margin-top:1px}.s i{font-style:normal}
.cell.fri{border-color:var(--gold)}
.cell.eid{background:rgba(251,191,36,.2);border-color:var(--gold)}
.cell.ram{border-bottom:3px solid var(--ok)}
.cell.today{background:var(--ac)}.cell.today .g,.cell.today i{color:#fff!important}
.cell.hol::after,.cell.nt::before{content:"";position:absolute;top:3px;width:6px;height:6px;border-radius:50%}
.cell.hol::after{right:4px;background:#ef4444}.cell.nt::before{left:4px;background:var(--gold)}
.btn{background:var(--ac);color:#fff;border:none;padding:12px;border-radius:14px;font-weight:700;cursor:pointer;box-shadow:0 0 14px var(--glow);font-size:1rem;transition:.2s;display:flex;justify-content:center;align-items:center}
.btn.alt{background:var(--gl);color:var(--tx);box-shadow:none;border:1px solid var(--ln)}.btn.w{width:100%;margin-top:10px}
.in{width:100%;background:var(--gl);border:1px solid var(--ln);color:var(--tx);padding:11px;border-radius:12px;outline:none;font-size:1rem;transition:.2s}
.in:focus{border-color:var(--ac);box-shadow:0 0 12px var(--glow)}textarea.in{resize:vertical;min-height:80px}
.form{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.chips{display:flex;gap:4px}

.al{background:var(--gl);border:1px solid var(--ln);padding:11px 13px;border-radius:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;animation:slx .4s both;transition:opacity .3s}
.al.off{opacity:.5}.al strong{color:var(--ac);font-size:1.15rem}.al small{display:block;opacity:.75;font-size:.78rem}.al input{width:20px;height:20px;accent-color:var(--ac)}

.box h4{font-size:.9rem;color:var(--ac);margin-bottom:9px}
.big{font-size:2rem;font-weight:800;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fit{flex:none}
.sws{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:100;padding:16px}
.modal.bot{align-items:flex-end;padding:0}
.modal.on{display:flex;animation:fadeo .25s}

.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}

function bnLens(y){const gy=y+594,lp=(gy%4===0&&gy%100!==0)||gy%400===0;return[31,31,31,31,31,30,30,30,30,30,lp?31:30,30]}
function bnParts(d){

}

}

function evOf(c){
  const o=[],h=hjParts(c),b=bnParts(c),g=NAT.g[(c.getMonth()+1)+'-'+c.getDate()],bb=NAT.b[b.m+'-'+b.d],he=HE[h.m+'-'+h.d];
  if(g)o.push([g[L],'nat']);if(bb)o.push([bb[L],'nat']);if(he)o.push([he[L],he[2]]);
  if(h.m===9)o.push([t('ramFast'),'r']);

}
function hjStart(y,m){

  for(let i=0;i<=4;i++)for(const s of[i,-i]){const c=addD(ap,s),p=hjParts(c);if(p.d===1&&p.m===m+1)return c}
  return addD(ap,0);

/* নামাজের সময় (কারাচি পদ্ধতি, হানাফি আসর) — ডিভাইসেই হিসাব */
const D=Math.PI/180,sin=a=>Math.sin(a*D),cos=a=>Math.cos(a*D),tan=a=>Math.tan(a*D),asin=x=>Math.asin(x)/D,acos=x=>Math.acos(x)/D,atan2=(y,x)=>Math.atan2(y,x)/D,fx=(a,n)=>a-n*Math.floor(a/n);
function jd(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunTimes(date){
  const[lat,lon]=coords(),tz=-date.getTimezoneOffset()/60,J=jd(date.getFullYear(),date.getMonth()+1,date.getDate())-lon/360;
  const sp=q0=>{const Dd=J+q0-2451545,g=fx(357.529+.98560028*Dd,360),q=fx(280.459+.98564736*Dd,360),Lg=fx(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-3.6e-7*Dd,RA=fx(atan2(cos(e)*sin(Lg),cos(Lg))/15,24);return{dc:asin(sin(e)*sin(Lg)),eq:q/15-RA}};
  const mid=q=>fx(12-sp(q).eq,24),ang=(a,q,ccw)=>{const dc=sp(q).dc,v=acos((-sin(a)-sin(dc)*sin(lat))/(cos(dc)*cos(lat)))/15;return mid(q)+(ccw?-v:v)};

}

    const Y=sunTimes(new Date(n.getFullYear(),n.getMonth(),n.getDate()-1)),Z=sunTimes(n),M=sunTimes(new Date(n.getFullYear(),n.getMonth(),n.getDate()+1));
    SC={key,Z,list:[['isha0',Y.isha,Z.fajr],['fajr',Z.fajr,Z.sunrise],['dhuhr',Z.dhuhr,Z.asr],['asr',Z.asr,Z.sunset],['maghrib',Z.maghrib,Z.isha],['isha',Z.isha,M.fajr]]};

/* সূর্যোদয়/সূর্যাস্ত — Open-Meteo ওয়েদার API (অফলাইনে ডিভাইসের হিসাব) */

  if(!fbOn())return`<div class="note" style="text-align:left">${t('acOff')}</div>`;
  const m=accMsg?`<div class="note" style="text-align:left;margin-top:8px">${esc(accMsg)}</div>`:'';
  if(FBU)return`<div class="row" style="margin-top:6px"><b style="text-align:left;word-break:break-all">${esc(FBU.email||FBU.displayName||'')}</b></div><div class="note" style="text-align:left">${t('acOk')}${S.syncT?' · '+t('acLast')+': '+new Date(S.syncT).toLocaleTimeString(S.lang==='bn'?'bn-BD':'en-US',{hour:'2-digit',minute:'2-digit'}):''}</div><div class="row" style="margin-top:8px"><button class="btn alt" onclick="cloudPush(true).then(accRender)">${t('acSync')}</button><button class="btn alt" onclick="accOut()">${t('acOut')}</button></div>${m}`;
  return`<p data-x style="opacity:.85;font-size:.85rem;margin:8px 0;text-align:left">${t('acP')}</p>${NATIVE?'':`<button class="btn w" style="margin-top:0" onclick="accG()">${t('acG')}</button>`}<input id="${k}E" type="email" autocomplete="email" class="in" style="margin-top:10px" placeholder="${t('acE')}"><input id="${k}P" type="password" autocomplete="current-password" class="in" style="margin-top:8px" placeholder="${t('acPw')}"><div class="row" style="margin-top:8px"><button class="btn alt" onclick="accEm('${k}',0)">${t('acIn')}</button><button class="btn alt" onclick="accEm('${k}',1)">${t('acUp')}</button></div><button class="btn alt w" style="margin-top:8px" onclick="accRs('${k}')">${t('acRs')}</button>${m}`;
}
function accRender(){const a=$('accBox'),b=$('accOb');if(a)a.innerHTML=accBox('s');if(b)b.innerHTML=accBox('o')}
function accSay(m){accMsg=m;accRender()}
async function accReady(){if(navigator.onLine===false){accSay(t('acNet'));return false}accSay(t('acBusy'));try{await fbLoad();accSay('');return true}catch(e){accSay(t('acNet'));return false}}
const accER=e=>({'auth/email-already-in-use':t('acExist'),'auth/weak-password':t('acWeak'),'auth/network-request-failed':t('acNet'),'auth/popup-closed-by-user':''}[e.code]??t('acErr'));
async function accG(){
  if(!await accReady())return;
  try{await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())}
  catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{await firebase.auth().signInWithRedirect(new firebase.auth.GoogleAuthProvider())}catch(x){accSay(accER(x))}}else accSay(accER(e))}
}
async function accEm(k,up){
  const e=($(k+'E').value||'').trim(),p=$(k+'P').value||'';
  if(!e||!p){accSay(t('acFill'));return}
  if(!await accReady())return;
  try{const a=firebase.auth();up?await a.createUserWithEmailAndPassword(e,p):await a.signInWithEmailAndPassword(e,p)}catch(x){accSay(accER(x))}
}
async function accRs(k){
  const e=($(k+'E').value||'').trim();if(!e){accSay(t('acFill'));return}
  if(!await accReady())return;
  try{await firebase.auth().sendPasswordResetEmail(e);accSay(t('acSent'))}catch(x){accSay(accER(x))}
}
async function accOut(){try{await firebase.auth().signOut()}catch(e){}FBU=null;delete S.acct;sv('cal_v4',S);accRender()}
if(!S.onb){S.locAsked=true;$('onb').classList.add('on')}accInit();adSw('adSwS');locInit();updInit();$('ver').textContent=APP_VER;$('crY').textContent=dg(new Date().getFullYear());
if(NATIVE){document.documentElement.classList.add('nat');applyFired();qPush()}
{const q=new URLSearchParams(location.search);if(q.get('view')==='widget')document.documentElement.classList.add('wg');if(q.get('tab'))tab(q.get('tab'));if(q.get('ram'))openRam()}
if(!NATIVE&&'serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
(function loop(){let d;if(document.hidden){const n=new Date();checkAlarms(n);adhanCheck(n);d=5000}else{tick();if(tmEnd)tmDraw();d=1000-Date.now()%1000+10}setTimeout(loop,d)})();
document.addEventListener('visibilitychange',()=>{document.documentElement.classList.toggle('hid',document.hidden);if(!document.hidden)tick(true)});
</script>
